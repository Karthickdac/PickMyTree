openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: PICK A TREE versioned platform API. Commercial activation requires approved real inventory and connected providers.
servers:
  - url: /api
paths:
  /v1/management/schemes:
    get:
      operationId: listManagedSchemes
      responses:
        "200":
          description: Administrator-only scheme drafts and archived schemes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ManagedScheme" } }
        "401": { $ref: "#/components/responses/Failure" }
        "403": { $ref: "#/components/responses/Failure" }
    post:
      operationId: createManagedScheme
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchemeEditorInput" }
      responses:
        "201":
          description: Saved scheme draft, never a published offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedScheme" }
        "400": { $ref: "#/components/responses/Failure" }
        "403": { $ref: "#/components/responses/Failure" }
  /v1/management/schemes/{schemeId}:
    parameters:
      - { name: schemeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getManagedScheme
      responses:
        "200":
          description: Saved administrator scheme configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedScheme" }
        "404": { $ref: "#/components/responses/Failure" }
    patch:
      operationId: updateManagedScheme
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchemeEditorUpdate" }
      responses:
        "200":
          description: New saved revision of the draft or archive status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedScheme" }
        "400": { $ref: "#/components/responses/Failure" }
        "409": { $ref: "#/components/responses/Failure" }
  /v1/management/schemes/{schemeId}/revisions:
    parameters:
      - { name: schemeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listSchemeRevisions
      responses:
        "200":
          description: Append-only snapshots recorded for each saved revision
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SchemeRevision" } }
        "404": { $ref: "#/components/responses/Failure" }
  /v1/management/farms:
    get:
      operationId: listManagedFarms
      responses:
        "200":
          description: Farms visible to the signed-in manager
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedFarmList" }
        "403": { $ref: "#/components/responses/Failure" }
    post:
      operationId: createManagedFarm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmEditorInput" }
      responses:
        "201":
          description: Created farm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedFarm" }
        "400": { $ref: "#/components/responses/Failure" }
  /v1/management/farms/{farmId}:
    parameters:
      - { name: farmId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateManagedFarm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmEditorUpdate" }
      responses:
        "200":
          description: Saved farm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedFarm" }
        "409": { $ref: "#/components/responses/Failure" }
  /v1/management/farms/{farmId}/trees:
    parameters:
      - { name: farmId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listManagedTrees
      responses:
        "200":
          description: Trees belonging to the selected farm
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ManagedTree" } }
    post:
      operationId: createManagedTree
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreeEditorInput" }
      responses:
        "201":
          description: Created tree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedTree" }
  /v1/management/trees/{treeId}:
    parameters:
      - { name: treeId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateManagedTree
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreeEditorUpdate" }
      responses:
        "200":
          description: Saved tree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedTree" }
        "409": { $ref: "#/components/responses/Failure" }
  /v1/management/images/request-upload:
    post:
      operationId: requestFarmImageUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmImageUploadInput" }
      responses:
        "201":
          description: Short-lived direct upload URL, not a completed image
          content:
            application/json:
              schema:
                type: object
                required: [id, uploadURL]
                properties:
                  id: { type: string, format: uuid }
                  uploadURL: { type: string }
        "503": { $ref: "#/components/responses/Failure" }
  /v1/management/images/{imageId}/complete:
    parameters:
      - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeFarmImageUpload
      responses:
        "200":
          description: Validated public catalogue image, ready to attach to a farm or tree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueImage" }
        "400": { $ref: "#/components/responses/Failure" }
  /v1/catalogue/images/{imageId}:
    parameters:
      - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: serveCatalogueImage
      responses:
        "200":
          description: Validated catalogue photo
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Failure" }
  /v1/auth/config:
    get:
      operationId: getPhoneAuthConfig
      responses:
        "200":
          description: Phone authentication availability without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneAuthConfig" }
  /auth/login:
    get:
      operationId: startPhoneSignIn
      description: Top-level browser navigation to Auth0 passwordless SMS. This endpoint does not send an SMS itself.
      responses:
        "302":
          description: Redirect to secure mobile verification
        "503":
          $ref: "#/components/responses/Failure"
  /auth/callback:
    get:
      operationId: finishPhoneSignIn
      description: SDK-owned OIDC callback validates authorization code, PKCE, state, nonce, issuer and signed identity. Never call directly from application forms.
      responses:
        "302":
          description: Redirect to customer portal after verification
        "303":
          description: Redirect to sign-in with a safe error code
  /auth/logout:
    post:
      operationId: endPhoneSession
      description: Same-origin browser form clears the application session and starts provider sign-out.
      responses:
        "302":
          description: Redirect through provider logout to the public homepage
        "403":
          $ref: "#/components/responses/Failure"
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /v1/public/trees:
    get:
      operationId: listPublicTrees
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: species, schema: { type: string } }
      responses:
        "200":
          description: Approved inventory only
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Tree" } }
  /v1/public/trees/{id}:
    get:
      operationId: getPublicTree
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public tree with eligible schemes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeDetail" }
        "404":
          $ref: "#/components/responses/Failure"
  /v1/public/farms:
    get:
      operationId: listPublicFarms
      responses:
        "200":
          description: Approved farm profiles without private coordinates
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Farm" } }
  /v1/public/articles:
    get:
      operationId: listArticles
      responses:
        "200":
          description: Published educational content
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Article" } }
  /v1/public/enquiries:
    post:
      operationId: submitEnquiry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnquiryInput" }
      responses:
        "201":
          description: Enquiry recorded; does not imply message delivery or an adoption
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Confirmation" }
        "400":
          $ref: "#/components/responses/Failure"
  /v1/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current application user and scoped role assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401":
          $ref: "#/components/responses/Failure"
  /v1/me/profile:
    patch:
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
  /v1/me/dashboard:
    get:
      operationId: getCustomerDashboard
      responses:
        "200":
          description: Customer-owned records and next steps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /v1/workspace/modules:
    get:
      operationId: listWorkspaceModules
      responses:
        "200":
          description: Server-authorized modules and fields
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Module" } }
  /v1/workspace/summary:
    get:
      operationId: getWorkspaceSummary
      responses:
        "200":
          description: Scoped counts and recent activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSummary" }
  /v1/workspace/{module}/records:
    parameters:
      - { in: path, name: module, required: true, schema: { type: string } }
    get:
      operationId: listRecords
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Scoped paginated records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordPage" }
    post:
      operationId: createRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "201":
          description: Validated record created in initial state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformRecord" }
        "400":
          $ref: "#/components/responses/Failure"
        "403":
          $ref: "#/components/responses/Failure"
  /v1/workspace/{module}/records/{id}:
    parameters:
      - { in: path, name: module, required: true, schema: { type: string } }
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordUpdate" }
      responses:
        "200":
          description: Updated draft or reasoned state transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformRecord" }
        "409":
          $ref: "#/components/responses/Failure"
  /v1/readiness:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Honest public service availability and commercial gates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
components:
  responses:
    Failure:
      description: Request could not be completed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    CatalogueImage:
      type: object
      required: [id, url, name, isIllustrative]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        name: { type: string }
        isIllustrative: { type: boolean }
    FarmEditorInput:
      type: object
      required: [name, district, description, location, areaAcres, status, imageIds]
      properties:
        name: { type: string, minLength: 2, maxLength: 180 }
        district: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, minLength: 5, maxLength: 5000 }
        location: { type: string, maxLength: 300 }
        areaAcres: { type: number, minimum: 0, maximum: 100000 }
        status: { type: string, enum: [draft, listed, archived] }
        imageIds: { type: array, maxItems: 12, items: { type: string, format: uuid } }
    FarmEditorUpdate:
      allOf:
        - { $ref: "#/components/schemas/FarmEditorInput" }
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 1 }
    ManagedFarm:
      allOf:
        - { $ref: "#/components/schemas/FarmEditorInput" }
        - type: object
          required: [id, version, isSample, images, treeCount]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            isSample: { type: boolean }
            images: { type: array, items: { $ref: "#/components/schemas/CatalogueImage" } }
            treeCount: { type: integer }
    ManagedFarmList:
      type: object
      required: [items, storageAvailable]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ManagedFarm" } }
        storageAvailable: { type: boolean }
    TreeEditorInput:
      type: object
      required: [name, species, variety, zone, age, description, condition, status, imageIds]
      properties:
        name: { type: string, minLength: 2, maxLength: 180 }
        species: { type: string, enum: [Mango, Guava, Coconut] }
        variety: { type: string, minLength: 2, maxLength: 120 }
        zone: { type: string, maxLength: 120 }
        age: { type: string, maxLength: 100 }
        description: { type: string, minLength: 5, maxLength: 5000 }
        condition: { type: string, maxLength: 500 }
        status: { type: string, enum: [draft, listed, temporarily-unavailable, archived] }
        imageIds: { type: array, maxItems: 12, items: { type: string, format: uuid } }
    TreeEditorUpdate:
      allOf:
        - { $ref: "#/components/schemas/TreeEditorInput" }
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 1 }
    ManagedTree:
      allOf:
        - { $ref: "#/components/schemas/TreeEditorInput" }
        - type: object
          required: [id, farmId, treeCode, version, isSample, images]
          properties:
            id: { type: string, format: uuid }
            farmId: { type: string, format: uuid }
            treeCode: { type: string }
            version: { type: integer }
            isSample: { type: boolean }
            images: { type: array, items: { $ref: "#/components/schemas/CatalogueImage" } }
    FarmImageUploadInput:
      type: object
      required: [name, contentType, size]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 10485760 }
    PhoneAuthConfig:
      type: object
      required: [configured, loginPath, logoutPath]
      properties:
        configured: { type: boolean }
        loginPath: { type: string }
        logoutPath: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        requestId: { type: string }
    Confirmation:
      type: object
      required: [id, message]
      properties:
        id: { type: string }
        message: { type: string }
    Farm:
      type: object
      required: [id, name, district, description]
      properties:
        id: { type: string }
        name: { type: string }
        district: { type: string }
        description: { type: string }
        image: { type: string }
        practices: { type: array, items: { type: string } }
        isSample: { type: boolean }
        images: { type: array, items: { $ref: "#/components/schemas/CatalogueImage" } }
        areaAcres: { type: number }
        treeCount: { type: integer }
        location: { type: string }
    Tree:
      type: object
      required: [id, treeCode, name, species, variety, farmName, zone, status, description]
      properties:
        id: { type: string }
        treeCode: { type: string }
        name: { type: string }
        species: { type: string }
        variety: { type: string }
        farmName: { type: string }
        zone: { type: string }
        status: { type: string }
        description: { type: string }
        image: { type: string }
        age: { type: string }
        inspectedAt: { type: string }
        productiveAssessment: { type: string }
        isSample: { type: boolean }
        images: { type: array, items: { $ref: "#/components/schemas/CatalogueImage" } }
        farmId: { type: string }
        adoptionEligible: { type: boolean }
    SchemeConfiguration:
      type: object
      additionalProperties: false
      required: [description, species, variety, farmId, treeIds, durationMonths, feePaise, taxBps, allocationType, quantity, unit, sharePercent, maxAdopters, enrollmentStart, enrollmentEnd, season, roundingRule, qualityGrades, lossRules, fulfilmentMethods, deliveryFeePaise, deliveryRegions, fulfilmentPolicy, inclusions, exclusions, risks, shortfallPolicy, cancellationPolicy, renewalPolicy, agreementVersion, terms, legalReviewReference]
      properties:
        description: { type: string, maxLength: 4000 }
        species: { type: string, enum: [Mango, Guava, Coconut] }
        variety: { type: string, maxLength: 120 }
        farmId: { type: ["string", "null"], format: uuid }
        treeIds: { type: array, maxItems: 500, uniqueItems: true, items: { type: string, format: uuid } }
        durationMonths: { type: integer, minimum: 1, maximum: 120 }
        feePaise: { type: integer, minimum: 0, maximum: 1000000000 }
        taxBps: { type: integer, minimum: 0, maximum: 10000 }
        allocationType: { type: string, enum: [fixed-quantity, harvest-share, exclusive-harvest, sale-proceeds] }
        quantity: { type: ["number", "null"], exclusiveMinimum: 0, maximum: 1000000 }
        unit: { type: string, enum: [kg, count] }
        sharePercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
        maxAdopters: { type: integer, minimum: 1, maximum: 100000 }
        enrollmentStart: { type: ["string", "null"], format: date }
        enrollmentEnd: { type: ["string", "null"], format: date }
        season: { type: string, maxLength: 120 }
        roundingRule: { type: string, enum: [down, nearest, up] }
        qualityGrades: { type: string, maxLength: 2000 }
        lossRules: { type: string, maxLength: 4000 }
        fulfilmentMethods: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [pickup, delivery, sale-settlement] } }
        deliveryFeePaise: { type: integer, minimum: 0, maximum: 1000000000 }
        deliveryRegions: { type: string, maxLength: 2000 }
        fulfilmentPolicy: { type: string, maxLength: 4000 }
        inclusions: { type: string, maxLength: 4000 }
        exclusions: { type: string, maxLength: 4000 }
        risks: { type: string, maxLength: 4000 }
        shortfallPolicy: { type: string, maxLength: 4000 }
        cancellationPolicy: { type: string, maxLength: 4000 }
        renewalPolicy: { type: string, maxLength: 4000 }
        agreementVersion: { type: string, maxLength: 120 }
        terms: { type: string, maxLength: 20000 }
        legalReviewReference: { type: string, maxLength: 500 }
    SchemeEditorInput:
      type: object
      required: [name, configuration]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        configuration: { $ref: "#/components/schemas/SchemeConfiguration" }
    SchemeEditorUpdate:
      allOf:
        - { $ref: "#/components/schemas/SchemeEditorInput" }
        - type: object
          required: [version, reason, status]
          properties:
            version: { type: integer, minimum: 1 }
            reason: { type: string, minLength: 3, maxLength: 2000 }
            status: { type: string, enum: [draft, archived] }
    ManagedScheme:
      allOf:
        - { $ref: "#/components/schemas/SchemeEditorInput" }
        - type: object
          required: [id, version, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            status: { type: string, enum: [draft, archived] }
            createdAt: { type: string }
            updatedAt: { type: string }
    SchemeRevision:
      allOf:
        - { $ref: "#/components/schemas/SchemeEditorInput" }
        - type: object
          required: [version, status, recordedAt, reason]
          properties:
            version: { type: integer, minimum: 1 }
            status: { type: string, enum: [draft, archived] }
            recordedAt: { type: string }
            reason: { type: string }
    Scheme:
      type: object
      required: [id, name, version, feePaise, durationMonths, entitlement, disclosures]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        feePaise: { type: integer }
        durationMonths: { type: integer }
        entitlement: { type: string }
        disclosures: { type: string }
    TreeDetail:
      type: object
      required: [tree, schemes]
      properties:
        tree: { $ref: "#/components/schemas/Tree" }
        schemes: { type: array, items: { $ref: "#/components/schemas/Scheme" } }
    Article:
      type: object
      required: [id, title, category, excerpt, body]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        excerpt: { type: string }
        body: { type: string }
        image: { type: string }
        readingMinutes: { type: integer }
    EnquiryInput:
      type: object
      required: [kind, name, email, message, consent]
      properties:
        kind: { type: string, enum: [adoption, wedding, personal, corporate, contact, visit] }
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 30 }
        message: { type: string, minLength: 5, maxLength: 5000 }
        quantity: { type: integer, minimum: 1, maximum: 100000 }
        budgetPaise: { type: integer, minimum: 0 }
        eventDate: { type: string }
        location: { type: string, maxLength: 500 }
        language: { type: string, enum: [en, ta] }
        consent: { type: boolean }
    CurrentUser:
      type: object
      required: [id, displayName, roles, profile]
      properties:
        id: { type: string }
        displayName: { type: string }
        roles: { type: array, items: { type: string } }
        profile: { $ref: "#/components/schemas/ProfileInput" }
    ProfileInput:
      type: object
      properties:
        displayName: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 1000 }
        language: { type: string, enum: [en, ta] }
        emailNotifications: { type: boolean }
        smsNotifications: { type: boolean }
        whatsappNotifications: { type: boolean }
    Dashboard:
      type: object
      required: [adoptions, harvests, orders, notifications, tickets]
      properties:
        adoptions: { type: array, items: { $ref: "#/components/schemas/PlatformRecord" } }
        harvests: { type: array, items: { $ref: "#/components/schemas/PlatformRecord" } }
        orders: { type: array, items: { $ref: "#/components/schemas/PlatformRecord" } }
        notifications: { type: array, items: { $ref: "#/components/schemas/PlatformRecord" } }
        tickets: { type: array, items: { $ref: "#/components/schemas/PlatformRecord" } }
    Field:
      type: object
      required: [key, label, type, required]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string }
        required: { type: boolean }
        options: { type: array, items: { type: string } }
        help: { type: string }
    Module:
      type: object
      required: [key, title, description, canCreate, fields, statuses]
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        canCreate: { type: boolean }
        fields: { type: array, items: { $ref: "#/components/schemas/Field" } }
        statuses: { type: array, items: { type: string } }
    PlatformRecord:
      type: object
      required: [id, title, status, version, createdAt, data]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        farmId: { type: ["string", "null"] }
        treeId: { type: ["string", "null"] }
        customerId: { type: ["string", "null"] }
        data: { type: object, additionalProperties: true }
        allowedTransitions: { type: array, items: { type: string } }
    RecordPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PlatformRecord" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    RecordInput:
      type: object
      required: [title, data]
      properties:
        title: { type: string, minLength: 2, maxLength: 200 }
        farmId: { type: ["string", "null"], format: uuid }
        treeId: { type: ["string", "null"], format: uuid }
        data: { type: object, additionalProperties: true }
    RecordUpdate:
      type: object
      required: [version, reason]
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 5, maxLength: 2000 }
        status: { type: string }
        title: { type: string, minLength: 2, maxLength: 200 }
        data: { type: object, additionalProperties: true }
    Count:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: integer }
    WorkspaceSummary:
      type: object
      required: [counts, recent]
      properties:
        counts: { type: array, items: { $ref: "#/components/schemas/Count" } }
        recent: { type: array, items: { $ref: "#/components/schemas/PlatformRecord" } }
    Readiness:
      type: object
      required: [adoptionsOpen, message, gates]
      properties:
        adoptionsOpen: { type: boolean }
        message: { type: string }
        gates: { type: array, items: { type: string } }
